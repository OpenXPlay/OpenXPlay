        zh: H.265 画面曾黑屏（10-20），安卓应用 0.1.5 修复
        ru: изображение H.265 оставалось чёрным (10-20); исправлено в приложении для Android 0.1.5
        es: la imagen H.265 se quedaba en negro (10-20); corregido en la app de Android 0.1.5
  - item: fullscreen
