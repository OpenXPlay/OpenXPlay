    carlink:
      status: fixed
      text:
        en: touches landed off target with the picture in the Carlink window’s shape (10-21); fixed in Android app 0.1.5
        zh: 画面按 Carlink 窗口比例显示时触控曾偏移（10-21），安卓应用 0.1.5 修复
        ru: когда изображение имело форму окна Carlink, касания попадали мимо цели (10-21); исправлено в приложении для Android 0.1.5
