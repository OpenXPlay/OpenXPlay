      status: fail
      text:
        en: an owner reported that every later connection still needs the car’s pairing-code page open (10-23)
        zh: 车主反馈之后每次仍要先打开车机的配对码页面（10-23）

setup:
  - label: {en: Which to choose, zh: 怎么选}
    text:
      en: Both routes have shown a picture in the car. The browser route has been tested more and runs full screen with the Android relay; the Carlink route uses the car’s own Carlink app.
      zh: 两条路线在车上都显示过画面。浏览器路线测得更多，使用安卓中继时可以全屏；Carlink 路线用车机自带的 Carlink 应用。
  - label: {en: Browser route, zh: 浏览器路线}
    text:
      en: Use the Android relay and choose XPeng G6 2023 in Settings → Car and screen. On a relay with only 2.4 GHz Wi-Fi, such as the UFI003, set the frame rate to 30 in the web receiver’s settings. If the picture takes long to appear with H.265, set *Video codec* to *Force H.264*.
      zh: 推荐用安卓中继，并在“设置 → 车型与屏幕”中选择小鹏 G6 2023 款。中继只有 2.4 GHz Wi-Fi 时（例如 UFI003），在网页接收端的设置中把帧率设为 30。使用 H.265 时画面迟迟不出现，就把“视频编码”改为“强制 H.264”。
  - label: {en: Carlink route, zh: Carlink 路线}
    text:
      en: Use Android app 0.1.5 or later ([download the latest version](https://github.com/OpenXPlay/OpenXPlay-Relay/releases/latest/download/openxplay-relay.apk)) on a relay phone with 5 GHz Wi-Fi (Carlink needs Android 10 or later); on the first connection, enter the pairing code shown on the car’s screen into the relay. Leave *Video codec* on *Automatic* and the relay sends the H.265 picture as it is.
      zh: 使用安卓应用 0.1.5 或更新版本（[下载最新版本](https://github.com/OpenXPlay/OpenXPlay-Relay/releases/latest/download/openxplay-relay.apk)），中继手机需要支持 5 GHz Wi-Fi（Carlink 需要 Android 10 及以上），第一次连接时在中继中输入车机屏幕上的配对码。“视频编码”保持“自动”，中继会直接发送 H.265 画面。

browser:
  intro:
    en: >-
      The XPeng G6 has a built-in browser based on Chromium 120 with WebCodecs. What follows is what the
      browser itself reports, the same kind of items as [Check your head unit](/en/check): H.264 (Baseline, Main
      and High) and H.265 at 720p and 1080p, at 30 and 60 fps, all reported as hardware decoding. The screen
      is 1372×686 CSS pixels. Outside full screen the page gets about 876×518; in full screen it gets either
      the whole screen or 876×579, and about 489×579 in split screen. The browser reports 5 touch points and
      AudioWorklet (needed to play CarPlay sound in the browser).
    zh: >-
      小鹏 G6 内置基于 Chromium 120 的浏览器，支持 WebCodecs。下面的能力是浏览器自己报告的，和[检测车机](/zh/check)报告的项目相同：H.264（Baseline、Main、High）和 H.265 在 720p 和 1080p、30 和 60 帧/秒下都报告为硬件解码。屏幕为 1372×686 CSS 像素。浏览器不全屏时，网页可用约 876×518；进入全屏后，网页有时占满整块屏幕，有时为 876×579；分屏时约 489×579。浏览器报告支持 5 点触控和 AudioWorklet（在浏览器中播放 CarPlay 声音要用到）。
  points:
    - label: {en: Video format, zh: 视频格式}
      text:
        en: 'In the test with the Linux relay on a UFI003 on 2026-10-16, H.264 was the most reliable: with H.265, a page opened or reloaded mid-session once waited more than 40 seconds for a picture. The Linux relay has since learned to switch to H.264 when the picture waits too long.'
        zh: 2026-10-16 用 UFI003 上的 Linux 中继测试时，H.264 最可靠：使用 H.265 时，中途打开或刷新网页后曾要等 40 多秒才出现画面。Linux 中继之后加入了画面等太久就改用 H.264 的处理。
    - label: {en: Frame rate, zh: 帧率}
      text:
        en: On a relay with only 2.4 GHz Wi-Fi, such as the UFI003, set the frame rate to 30 in the web receiver’s settings. In the tests of 2026-10-15—16, 60 fps stuttered over the 2.4 GHz link; 30 fps was clearly smoother, with occasional slight stutter.
        zh: 中继只有 2.4 GHz Wi-Fi 时（例如 UFI003），请在网页接收端的设置中把帧率设为 30。2026-10-15—16 的测试中，经 2.4 GHz 连接以 60 帧/秒播放会卡顿；30 帧/秒明显更流畅，偶尔仍有轻微卡顿。
    - label: {en: Full screen and reversing, zh: 全屏与倒车}
      text:
        en: With the Android relay the page runs full screen by default. The reverse camera makes the browser leave full screen, and this car’s browser doesn’t let the page return by itself (2026-10-18); back on the page, a tap restores full screen. For the current releases, see the [known issue](/en/daily-use#fullscreen-known-issue).
        zh: 使用安卓中继时，网页默认全屏。倒车影像会让浏览器退出全屏，这台车的浏览器不允许网页自动恢复（2026-10-18）；回到网页后轻触一下恢复全屏，当前版本的问题见[已知问题](/zh/daily-use#fullscreen-known-issue)。
    - label: {en: Car setting, zh: 车型设置}
      text:
        en: 'In the Android relay’s Settings → Car and screen, choose XPeng G6 2023: the relay uses its built-in screen data so CarPlay fits full screen, windows and split screen, switching without reconnecting.'
        zh: 在安卓中继的“设置 → 车型与屏幕”中选择小鹏 G6 2023 款，中继会使用内置的屏幕数据，让 CarPlay 画面贴合全屏、窗口和分屏，切换时不用重新连接。
  report:
    date: 2026-10-16
    browser:
      en: Chromium 120.0.6099.144 (its user agent claims desktop Linux x86_64)
      zh: Chromium 120.0.6099.144（用户代理自称桌面版 Linux x86_64）
    gpu:
      en: Qualcomm Adreno 640 through ANGLE, OpenGL ES 3.2; maximum texture size 4096; no WebGPU
      zh: Qualcomm Adreno 640（经 ANGLE），OpenGL ES 3.2；最大纹理尺寸 4096；不提供 WebGPU
    cpu: {en: 8 cores, zh: 8 核}
    memory:
      en: 8 GB reported device memory; JavaScript heap limit about 1.1 GB
      zh: 报告的设备内存为 8 GB；JavaScript 堆上限约 1.1 GB
    screen:
      en: 1372×686 CSS pixels at device pixel ratio 1.75 (about 2400×1200 physical pixels), landscape, 59.9 Hz
      zh: 1372×686 CSS 像素，设备像素比 1.75（约 2400×1200 物理像素），横屏，59.9 Hz
    window:
      en: 876×518 CSS pixels outside full screen; 1372×686 or 876×579 in full screen; about 489×579 in split screen
      zh: 不全屏时 876×518 CSS 像素；全屏时 1372×686 或 876×579；分屏时约 489×579
    touch: {en: 5 touch points, zh: 5 个触摸点}
    apis:
      en: WebCodecs (VideoDecoder, VideoFrame), OffscreenCanvas, requestVideoFrameCallback, AudioWorklet; secure context
      zh: WebCodecs（VideoDecoder、VideoFrame）、OffscreenCanvas、requestVideoFrameCallback、AudioWorklet；安全上下文
    audio:
      en: AAC and Opus decoders; 48 kHz; 5 ms base latency
      zh: AAC 和 Opus 解码器；采样率 48 kHz；基础延迟 5 ms
  video:
    rates: [30, 60]
    sizes: [1280×720, 1920×1080]
    formats:
      - {name: H.264 Baseline, decode: [hardware, hardware]}
      - {name: H.264 Main, decode: [hardware, hardware]}
      - {name: H.264 High, decode: [hardware, hardware]}
      - {name: H.265 Main, decode: [hardware, hardware]}
    notes:
      - en: 'The browser’s “smooth” flag is unreliable: it reported H.264 High at 720p and 30 fps as not smooth, but 60 fps and 1080p as smooth.'
        zh: 浏览器报告的“流畅”（smooth）标志不可靠：它把 720p、30 帧/秒的 H.264 High 报告为不流畅，却把 60 帧/秒和 1080p 报告为流畅。
      - en: 'Measured decode latency: about 33–59 ms per frame for H.264 and about 28 ms for H.265. This is the hardware decoder’s pipeline latency, not a throughput limit.'
        zh: 实测解码延迟：H.264 每帧约 33–59 ms，H.265 约 28 ms。这是硬件解码器的流水线延迟，并不说明解码速度跟不上。

carlink:
  intro:
    en: >-
      Tested in the car with development builds of the Android relay; the picture shows, and the
      [test results](#xpeng-g6-results) list each item. Android app 0.1.3 and earlier play sound on this car
      but keep the picture black; 0.1.5 fixes this. The car creates its own 5 GHz Wi-Fi network for Carlink
      and the relay joins it, so the relay needs 5 GHz Wi-Fi. The UFI003 can’t use Carlink; the Linux relay
      runs Carlink on a second Wi-Fi adapter.
    zh: >-
      已用安卓中继的开发版在车上测试，可以显示画面，逐项结果见[测试结果](#xpeng-g6-results)。安卓应用 0.1.3 及更早的版本在这台车上有声音但画面全黑，0.1.5 修复了这个问题。车机为 Carlink 建立自己的 5 GHz Wi-Fi，中继加入这个网络，因此中继需要支持 5 GHz Wi-Fi。UFI003 不能用 Carlink；Linux 中继用第二块 Wi-Fi 网卡运行 Carlink。
  video:
    h264:
      en: Constrained Baseline only, no Constrained High; level 3.1
      zh: 仅 Constrained Baseline，不支持 Constrained High；级别 3.1
    native: {en: '1280×720, progressive, 30 fps', zh: 1280×720，逐行扫描，30 帧/秒}
    h265:
      en: Reported as supported (`iccoa_support_hevc`); shows the iPhone’s H.265 picture directly, measured at up to about 58 fps
      zh: 车机声明支持（`iccoa_support_hevc`），可以直接显示 iPhone 的 H.265 画面，实测最高约 58 帧/秒
    display:
      en: The Carlink window (two thirds of the screen) is 1532×1013 at 240 dpi, unlike the 1280×720 video mode. From Android app 0.1.5, CarPlay takes this window’s shape and H.265 is sent at about 1532×1014; the car maps touches by the size of the picture it receives. When you switch to full screen during a session, the car doesn’t tell the relay the new size
      zh: Carlink 窗口（三分之二屏）为 1532×1013，240 dpi，与 1280×720 的视频模式不同。安卓应用 0.1.5 起，CarPlay 按这个窗口的比例显示，H.265 直接以约 1532×1014 发送；车机按收到的画面尺寸换算触控。会话中切换到全屏时，车机不会告诉中继新尺寸
    audio: AAC
    notes:
      en: |-
        The codec requested from the iPhone and the codec of the Carlink session aren’t always the same. This car reports H.265 support, so with the developer option *Carlink H.265* on *Automatic (default)*, the Carlink session uses H.265 from start to finish. With *Video codec* on *Automatic*, the relay passes the iPhone’s H.265 picture to the car unchanged when its format and size fit, with no transcoding on the phone; if the iPhone sends H.264 instead (for example with *Force H.264*), the relay converts it to H.265.

        The session uses H.264 only with *Carlink H.265* set to *Off*. The iPhone then sends H.264 High, which the car’s Carlink app can’t show, so the relay converts it to H.264 Constrained Baseline 3.1, scaled in the Carlink window’s shape to fit that level; the Android relay does this with its hardware encoder.
      zh: |-
        向 iPhone 请求的编码和 Carlink 会话的编码不一定相同。这台车声明支持 H.265，开发者选项中的“Carlink H.265”保持“自动（推荐）”时，Carlink 会话从头到尾只用 H.265：“视频编码”为“自动”时，中继把 iPhone 的 H.265 画面原样发给车机（格式和尺寸都合适时），手机不用转码；如果 iPhone 发出的是 H.264（例如设为“强制 H.264”），中继会把它转换为 H.265。

        只有把“Carlink H.265”设为“关闭”时，会话才用 H.264：iPhone 发出的 H.264 High 车机的 Carlink 应用无法显示，中继会把它转换为 H.264 Constrained Baseline 3.1，尺寸按 Carlink 窗口的比例缩小到这个级别允许的范围，安卓中继用硬件编码器完成转换。
  connection:
    wifi:
      en: The car creates its own 5 GHz Wi-Fi network for Carlink and the relay joins it, so the relay needs 5 GHz Wi-Fi, switched on. With wireless CarPlay on *This phone’s hotspot*, the Android relay ran a 5 GHz hotspot and joined the car over Wi-Fi at the same time, steadily for about an hour in testing.
      zh: 车机为 Carlink 建立自己的 5 GHz Wi-Fi，中继加入这个网络，因此中继需要支持 5 GHz Wi-Fi，并且 Wi-Fi 要保持打开。无线 CarPlay 使用“此手机的热点”时，安卓中继同时开 5 GHz 热点并用 Wi-Fi 连接车机，实测连续约一小时稳定。
    pairing:
      en: On the first connection, enter the pairing code shown on the car’s screen into the relay. The relay remembers the pairing, so the code normally isn’t needed again; connecting by itself after the car starts may need the car’s Carlink pairing-code page open.
      zh: 第一次连接时，在中继中输入车机屏幕上显示的配对码。中继会记住配对，之后通常不用再输入；车机开机后自动连接时，可能需要先打开车机 Carlink 应用的配对码页面。
    vehicle-info:
      en: 'Tested with this Carlink version (2026-10-20): the car accepted the vehicle information connection, but sent no data after changing gear, switching the lights and changing the day/night theme.'
      zh: 已在这个 Carlink 版本上测试（2026-10-20）：车机接受了车辆信息连接，但换挡、开关车灯和切换日夜主题后都没有发来数据。
