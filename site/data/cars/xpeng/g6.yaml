        es: un propietario informó que cada conexión posterior todavía necesita la página del código de enlace del auto abierta (10-23)

setup:
  - label: {en: Which to choose, zh: 怎么选, ru: Что выбрать, es: Cuál elegir}
    text:
      en: Both routes have shown a picture in the car. The browser route has been tested more and runs full screen with the Android relay; the Carlink route uses the car’s own Carlink app.
      zh: 两条路线在车上都显示过画面。浏览器路线测得更多，使用安卓中继时可以全屏；Carlink 路线用车机自带的 Carlink 应用。
      ru: Оба способа показали изображение в автомобиле. Способ через браузер испытан больше и с ретранслятором на Android работает в полноэкранном режиме; способ через Carlink использует собственное приложение Carlink автомобиля.
      es: Las dos rutas han mostrado imagen en el auto. La ruta del navegador se ha probado más y funciona en pantalla completa con el retransmisor Android; la ruta de Carlink usa la propia app Carlink del auto.
  - label: {en: Browser route, zh: 浏览器路线, ru: Через браузер, es: Ruta del navegador}
    text:
      en: Use the Android relay and choose XPeng G6 2023 in Settings → Car and screen. On a relay with only 2.4 GHz Wi-Fi, such as the UFI003, set the frame rate to 30 in the web receiver’s settings. If the picture takes long to appear with H.265, set *Video codec* to *Force H.264*.
      zh: 推荐用安卓中继，并在“设置 → 车型与屏幕”中选择小鹏 G6 2023 款。中继只有 2.4 GHz Wi-Fi 时（例如 UFI003），在网页接收端的设置中把帧率设为 30。使用 H.265 时画面迟迟不出现，就把“视频编码”改为“强制 H.264”。
      ru: Используйте ретранслятор на Android и выберите XPeng G6 2023 в Settings → Car and screen. На ретрансляторе только с Wi-Fi 2,4 ГГц, например UFI003, установите в настройках веб-приёмника частоту кадров 30. Если с H.265 изображение долго не появляется, установите *Video codec* в *Force H.264*.
      es: Usa el retransmisor Android y elige XPeng G6 2023 en Settings → Car and screen. En un retransmisor que solo tiene Wi-Fi de 2.4 GHz, como el UFI003, pon la frecuencia de cuadros en 30 en la configuración del receptor web. Si la imagen tarda en aparecer con H.265, pon *Video codec* en *Force H.264*.
  - label: {en: Carlink route, zh: Carlink 路线, ru: Через Carlink, es: Ruta de Carlink}
    text:
      en: Use Android app 0.1.5 or later ([download the latest version](https://github.com/OpenXPlay/OpenXPlay-Relay/releases/latest/download/openxplay-relay.apk)) on a relay phone with 5 GHz Wi-Fi (Carlink needs Android 10 or later); on the first connection, enter the pairing code shown on the car’s screen into the relay. Leave *Video codec* on *Automatic* and the relay sends the H.265 picture as it is.
      zh: 使用安卓应用 0.1.5 或更新版本（[下载最新版本](https://github.com/OpenXPlay/OpenXPlay-Relay/releases/latest/download/openxplay-relay.apk)），中继手机需要支持 5 GHz Wi-Fi（Carlink 需要 Android 10 及以上），第一次连接时在中继中输入车机屏幕上的配对码。“视频编码”保持“自动”，中继会直接发送 H.265 画面。
      ru: Используйте приложение для Android 0.1.5 или новее ([скачать последнюю версию](https://github.com/OpenXPlay/OpenXPlay-Relay/releases/latest/download/openxplay-relay.apk)) на телефоне-ретрансляторе с Wi-Fi 5 ГГц (для Carlink нужен Android 10 или новее); при первом подключении введите в ретрансляторе код сопряжения, показанный на экране автомобиля. Оставьте *Video codec* в положении *Automatic*, и ретранслятор передаст изображение H.265 как есть.
      es: Usa la app de Android 0.1.5 o posterior ([descarga la versión más reciente](https://github.com/OpenXPlay/OpenXPlay-Relay/releases/latest/download/openxplay-relay.apk)) en un teléfono retransmisor con Wi-Fi de 5 GHz (Carlink necesita Android 10 o posterior); en la primera conexión, ingresa en el retransmisor el código de enlace que aparece en la pantalla del auto. Deja *Video codec* en *Automatic* y el retransmisor envía la imagen H.265 tal como llega.

browser:
  intro:
    en: >-
      The XPeng G6 has a built-in browser based on Chromium 120 with WebCodecs. What follows is what the
      browser itself reports, the same kind of items as [Check your head unit](/en/check): H.264 (Baseline, Main
      and High) and H.265 at 720p and 1080p, at 30 and 60 fps, all reported as hardware decoding. The screen
      is 1372×686 CSS pixels. Outside full screen the page gets about 876×518; in full screen it gets either
      the whole screen or 876×579, and about 489×579 in split screen. The browser reports 5 touch points and
      AudioWorklet (needed to play CarPlay sound in the browser).
    zh: >-
      小鹏 G6 内置基于 Chromium 120 的浏览器，支持 WebCodecs。下面的能力是浏览器自己报告的，和[检测车机](/zh/check)报告的项目相同：H.264（Baseline、Main、High）和 H.265 在 720p 和 1080p、30 和 60 帧/秒下都报告为硬件解码。屏幕为 1372×686 CSS 像素。浏览器不全屏时，网页可用约 876×518；进入全屏后，网页有时占满整块屏幕，有时为 876×579；分屏时约 489×579。浏览器报告支持 5 点触控和 AudioWorklet（在浏览器中播放 CarPlay 声音要用到）。
    ru: >-
      У XPeng G6 встроенный браузер на основе Chromium 120 с WebCodecs. Ниже приведено то, о чём сообщает
      сам браузер, — те же пункты, что и в [проверке головного устройства](/ru/check): H.264 (Baseline, Main
      и High) и H.265 в 720p и 1080p, при 30 и 60 кадрах/с, — всё с аппаратным декодированием. Экран —
      1372×686 CSS-пикселей. Вне полноэкранного режима странице доступно около 876×518; в полноэкранном
      режиме — либо весь экран, либо 876×579, а при разделении экрана — около 489×579. Браузер сообщает о
      5 точках касания и AudioWorklet (нужен для воспроизведения звука CarPlay в браузере).
    es: >-
      El XPeng G6 tiene un navegador integrado basado en Chromium 120 con WebCodecs. Lo que sigue es lo que
      informa el propio navegador, los mismos tipos de elementos que [Verifica tu unidad principal](/es/check): H.264
      (Baseline, Main y High) y H.265 en 720p y 1080p, a 30 y 60 fps, todo informado como decodificación por
      hardware. La pantalla es de 1372×686 píxeles CSS. Fuera de pantalla completa la página tiene unos 876×518; en
      pantalla completa tiene toda la pantalla o 876×579, y unos 489×579 en pantalla dividida. El navegador informa
      5 puntos táctiles y AudioWorklet (necesario para reproducir el sonido de CarPlay en el navegador).
  points:
    - label: {en: Video format, zh: 视频格式, ru: Формат видео, es: Formato de video}
      text:
        en: 'In the test with the Linux relay on a UFI003 on 2026-10-16, H.264 was the most reliable: with H.265, a page opened or reloaded mid-session once waited more than 40 seconds for a picture. The Linux relay has since learned to switch to H.264 when the picture waits too long.'
        zh: 2026-10-16 用 UFI003 上的 Linux 中继测试时，H.264 最可靠：使用 H.265 时，中途打开或刷新网页后曾要等 40 多秒才出现画面。Linux 中继之后加入了画面等太久就改用 H.264 的处理。
        ru: 'При испытании с Linux-ретранслятором на UFI003 2026-10-16 самым надёжным оказался H.264: с H.265 страница, открытая или перезагруженная посреди сеанса, однажды ждала изображения более 40 секунд. С тех пор Linux-ретранслятор научился переключаться на H.264, если изображения приходится ждать слишком долго.'
        es: 'En la prueba con el retransmisor Linux en un UFI003 el 2026-10-16, H.264 fue el más confiable: con H.265, una página abierta o recargada a mitad de una sesión esperó una vez más de 40 segundos por la imagen. Desde entonces, el retransmisor Linux aprendió a cambiar a H.264 cuando la imagen tarda demasiado.'
    - label: {en: Frame rate, zh: 帧率, ru: Частота кадров, es: Cuadros por segundo}
      text:
        en: On a relay with only 2.4 GHz Wi-Fi, such as the UFI003, set the frame rate to 30 in the web receiver’s settings. In the tests of 2026-10-15—16, 60 fps stuttered over the 2.4 GHz link; 30 fps was clearly smoother, with occasional slight stutter.
        zh: 中继只有 2.4 GHz Wi-Fi 时（例如 UFI003），请在网页接收端的设置中把帧率设为 30。2026-10-15—16 的测试中，经 2.4 GHz 连接以 60 帧/秒播放会卡顿；30 帧/秒明显更流畅，偶尔仍有轻微卡顿。
        ru: На ретрансляторе только с Wi-Fi 2,4 ГГц, например UFI003, установите в настройках веб-приёмника частоту кадров 30. В испытаниях 2026-10-15—16 при 60 кадрах/с изображение по каналу 2,4 ГГц подтормаживало; при 30 кадрах/с было заметно плавнее, лишь изредка с небольшими рывками.
        es: En un retransmisor que solo tiene Wi-Fi de 2.4 GHz, como el UFI003, pon la frecuencia de cuadros en 30 en la configuración del receptor web. En las pruebas del 2026-10-15—16, a 60 fps la imagen se trababa por el enlace de 2.4 GHz; a 30 fps fue claramente más fluida, con alguna trabada leve ocasional.
    - label: {en: Full screen and reversing, zh: 全屏与倒车, ru: Полноэкранный режим и задний ход, es: Pantalla completa y reversa}
      text:
        en: With the Android relay the page runs full screen by default. The reverse camera makes the browser leave full screen, and this car’s browser doesn’t let the page return by itself (2026-10-18); back on the page, a tap restores full screen. For the current releases, see the [known issue](/en/daily-use#fullscreen-known-issue).
        zh: 使用安卓中继时，网页默认全屏。倒车影像会让浏览器退出全屏，这台车的浏览器不允许网页自动恢复（2026-10-18）；回到网页后轻触一下恢复全屏，当前版本的问题见[已知问题](/zh/daily-use#fullscreen-known-issue)。
        ru: С ретранслятором на Android страница по умолчанию открывается в полноэкранном режиме. Камера заднего вида выводит браузер из полноэкранного режима, а браузер этого автомобиля не позволяет странице вернуться в него самостоятельно (2026-10-18); вернувшись на страницу, коснитесь экрана, чтобы восстановить полноэкранный режим. О текущих версиях см. [известную проблему](/ru/daily-use#fullscreen-known-issue).
        es: Con el retransmisor Android, la página se abre en pantalla completa de forma predeterminada. La cámara de reversa hace que el navegador salga de pantalla completa, y el navegador de este auto no deja que la página vuelva sola (2026-10-18); al regresar a la página, un toque restablece la pantalla completa. Para las versiones actuales, consulta el [problema conocido](/es/daily-use#fullscreen-known-issue).
    - label: {en: Car setting, zh: 车型设置, ru: Настройка автомобиля, es: Configuración del auto}
      text:
        en: 'In the Android relay’s Settings → Car and screen, choose XPeng G6 2023: the relay uses its built-in screen data so CarPlay fits full screen, windows and split screen, switching without reconnecting.'
        zh: 在安卓中继的“设置 → 车型与屏幕”中选择小鹏 G6 2023 款，中继会使用内置的屏幕数据，让 CarPlay 画面贴合全屏、窗口和分屏，切换时不用重新连接。
        ru: 'В Settings → Car and screen ретранслятора на Android выберите XPeng G6 2023: ретранслятор использует встроенные данные об экране, чтобы CarPlay подстраивался под полноэкранный режим, окна и разделённый экран и переключался без повторного подключения.'
        es: 'En Settings → Car and screen del retransmisor Android, elige XPeng G6 2023: el retransmisor usa sus datos de pantalla integrados para que CarPlay se ajuste a pantalla completa, ventanas y pantalla dividida, y cambie sin volver a conectarse.'
