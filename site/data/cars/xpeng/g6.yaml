      zh: UFI003，Linux 中继开发版；安卓手机，0.1.3 开发版
      ru: UFI003, сборка Linux-ретранслятора для разработки; телефон Android, сборка 0.1.3 для разработки
    date: 2026-10-15..2026-10-18
    result:
