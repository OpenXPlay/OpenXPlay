      - {name: H.265 Main, decode: [hardware, hardware]}
    notes:
      - en: 'The browser’s “smooth” flag is unreliable: it reported H.264 High at 720p and 30 fps as not smooth, but 60 fps and 1080p as smooth.'
        zh: 浏览器报告的“流畅”（smooth）标志不可靠：它把 720p、30 帧/秒的 H.264 High 报告为不流畅，却把 60 帧/秒和 1080p 报告为流畅。
        ru: 'Признак «smooth» (плавно), который сообщает браузер, ненадёжен: H.264 High в 720p при 30 кадрах/с он назвал неплавным, а при 60 кадрах/с и в 1080p — плавным.'
        es: 'La marca “smooth” (fluido) del navegador no es confiable: informó H.264 High en 720p a 30 fps como no fluido, pero a 60 fps y en 1080p como fluido.'
      - en: 'Measured decode latency: about 33–59 ms per frame for H.264 and about 28 ms for H.265. This is the hardware decoder’s pipeline latency, not a throughput limit.'
        zh: 实测解码延迟：H.264 每帧约 33–59 ms，H.265 约 28 ms。这是硬件解码器的流水线延迟，并不说明解码速度跟不上。
        ru: 'Измеренная задержка декодирования: около 33–59 мс на кадр для H.264 и около 28 мс для H.265. Это задержка конвейера аппаратного декодера, а не предел пропускной способности.'
        es: 'Latencia de decodificación medida: unos 33–59 ms por cuadro para H.264 y unos 28 ms para H.265. Es la latencia del pipeline del decodificador por hardware, no un límite de rendimiento.'

carlink:
  intro:
    en: >-
      Tested in the car with development builds of the Android relay; the picture shows, and the
      [test results](#xpeng-g6-results) list each item. Android app 0.1.3 and earlier play sound on this car
      but keep the picture black; 0.1.5 fixes this. The car creates its own 5 GHz Wi-Fi network for Carlink
      and the relay joins it, so the relay needs 5 GHz Wi-Fi. The UFI003 can’t use Carlink; the Linux relay
      runs Carlink on a second Wi-Fi adapter.
    zh: >-
      已用安卓中继的开发版在车上测试，可以显示画面，逐项结果见[测试结果](#xpeng-g6-results)。安卓应用 0.1.3 及更早的版本在这台车上有声音但画面全黑，0.1.5 修复了这个问题。车机为 Carlink 建立自己的 5 GHz Wi-Fi，中继加入这个网络，因此中继需要支持 5 GHz Wi-Fi。UFI003 不能用 Carlink；Linux 中继用第二块 Wi-Fi 网卡运行 Carlink。
    ru: >-
      Испытано в автомобиле со сборками ретранслятора на Android для разработки; изображение показывается,
      а [результаты испытаний](#xpeng-g6-results) приведены по пунктам. Приложение для Android 0.1.3 и более
      ранние воспроизводят в этом автомобиле звук, но изображение остаётся чёрным; в 0.1.5 это исправлено.
      Автомобиль создаёт для Carlink собственную сеть Wi-Fi 5 ГГц, и ретранслятор подключается к ней, поэтому
      ретранслятору нужен Wi-Fi 5 ГГц. UFI003 не может работать с Carlink; Linux-ретранслятор использует для
      Carlink второй адаптер Wi-Fi.
    es: >-
      Probado en el auto con compilaciones de desarrollo del retransmisor Android; la imagen se muestra, y los
      [resultados de las pruebas](#xpeng-g6-results) detallan cada elemento. La app de Android 0.1.3 y anteriores
      reproducen sonido en este auto pero dejan la imagen en negro; 0.1.5 lo corrige. El auto crea su propia red
      Wi-Fi de 5 GHz para Carlink y el retransmisor se conecta a ella, así que el retransmisor necesita Wi-Fi de
      5 GHz. El UFI003 no puede usar Carlink; el retransmisor Linux ejecuta Carlink en un segundo adaptador Wi-Fi.
  video:
    h264:
      en: Constrained Baseline only, no Constrained High; level 3.1
      zh: 仅 Constrained Baseline，不支持 Constrained High；级别 3.1
      ru: Только Constrained Baseline, без Constrained High; уровень 3.1
      es: Solo Constrained Baseline, sin Constrained High; nivel 3.1
    native: {en: '1280×720, progressive, 30 fps', zh: 1280×720，逐行扫描，30 帧/秒, ru: '1280×720, прогрессивная развёртка, 30 кадров/с', es: '1280×720, progresivo, 30 fps'}
    h265:
      en: Reported as supported (`iccoa_support_hevc`); shows the iPhone’s H.265 picture directly, measured at up to about 58 fps
      zh: 车机声明支持（`iccoa_support_hevc`），可以直接显示 iPhone 的 H.265 画面，实测最高约 58 帧/秒
      ru: Заявлена поддержка (`iccoa_support_hevc`); изображение H.265 с iPhone показывается напрямую, измерено до примерно 58 кадров/с
      es: Informado como compatible (`iccoa_support_hevc`); muestra la imagen H.265 del iPhone directamente, medido hasta unos 58 fps
    display:
      en: The Carlink window (two thirds of the screen) is 1532×1013 at 240 dpi, unlike the 1280×720 video mode. From Android app 0.1.5, CarPlay takes this window’s shape and H.265 is sent at about 1532×1014; the car maps touches by the size of the picture it receives. When you switch to full screen during a session, the car doesn’t tell the relay the new size
      zh: Carlink 窗口（三分之二屏）为 1532×1013，240 dpi，与 1280×720 的视频模式不同。安卓应用 0.1.5 起，CarPlay 按这个窗口的比例显示，H.265 直接以约 1532×1014 发送；车机按收到的画面尺寸换算触控。会话中切换到全屏时，车机不会告诉中继新尺寸
      ru: Окно Carlink (две трети экрана) — 1532×1013 при 240 dpi, в отличие от видеорежима 1280×720. Начиная с приложения для Android 0.1.5, CarPlay принимает форму этого окна, а H.265 передаётся в размере около 1532×1014; автомобиль пересчитывает касания по размеру получаемого изображения. При переходе в полноэкранный режим во время сеанса автомобиль не сообщает ретранслятору новый размер
      es: La ventana de Carlink (dos tercios de la pantalla) es de 1532×1013 a 240 dpi, a diferencia del modo de video de 1280×720. Desde la app de Android 0.1.5, CarPlay toma la forma de esta ventana y H.265 se envía a unos 1532×1014; el auto ubica los toques según el tamaño de la imagen que recibe. Cuando cambias a pantalla completa durante una sesión, el auto no le informa al retransmisor el nuevo tamaño
    audio: AAC
    notes:
      en: |-
        The codec requested from the iPhone and the codec of the Carlink session aren’t always the same. This car reports H.265 support, so with the developer option *Carlink H.265* on *Automatic (default)*, the Carlink session uses H.265 from start to finish. With *Video codec* on *Automatic*, the relay passes the iPhone’s H.265 picture to the car unchanged when its format and size fit, with no transcoding on the phone; if the iPhone sends H.264 instead (for example with *Force H.264*), the relay converts it to H.265.

        The session uses H.264 only with *Carlink H.265* set to *Off*. The iPhone then sends H.264 High, which the car’s Carlink app can’t show, so the relay converts it to H.264 Constrained Baseline 3.1, scaled in the Carlink window’s shape to fit that level; the Android relay does this with its hardware encoder.
      zh: |-
        向 iPhone 请求的编码和 Carlink 会话的编码不一定相同。这台车声明支持 H.265，开发者选项中的“Carlink H.265”保持“自动（推荐）”时，Carlink 会话从头到尾只用 H.265：“视频编码”为“自动”时，中继把 iPhone 的 H.265 画面原样发给车机（格式和尺寸都合适时），手机不用转码；如果 iPhone 发出的是 H.264（例如设为“强制 H.264”），中继会把它转换为 H.265。

        只有把“Carlink H.265”设为“关闭”时，会话才用 H.264：iPhone 发出的 H.264 High 车机的 Carlink 应用无法显示，中继会把它转换为 H.264 Constrained Baseline 3.1，尺寸按 Carlink 窗口的比例缩小到这个级别允许的范围，安卓中继用硬件编码器完成转换。
      ru: |-
        Кодек, запрошенный у iPhone, и кодек сеанса Carlink не всегда совпадают. Этот автомобиль заявляет поддержку H.265, поэтому при параметре разработчика *Carlink H.265* в положении *Automatic (default)* сеанс Carlink от начала до конца использует H.265. Когда *Video codec* стоит в положении *Automatic*, ретранслятор передаёт изображение H.265 с iPhone в автомобиль без изменений, если его формат и размер подходят, без перекодирования на телефоне; если iPhone вместо этого отправляет H.264 (например, с *Force H.264*), ретранслятор преобразует его в H.265.

        Сеанс использует H.264, только если *Carlink H.265* установлен в *Off*. Тогда iPhone отправляет H.264 High, который приложение Carlink автомобиля показать не может, поэтому ретранслятор преобразует его в H.264 Constrained Baseline 3.1, уменьшая изображение в форме окна Carlink до размеров, допустимых на этом уровне; ретранслятор на Android делает это аппаратным кодировщиком.
      es: |-
        El códec que se le pide al iPhone y el códec de la sesión de Carlink no siempre son iguales. Este auto informa compatibilidad con H.265, así que con la opción para desarrolladores *Carlink H.265* en *Automatic (default)*, la sesión de Carlink usa H.265 de principio a fin. Con *Video codec* en *Automatic*, el retransmisor pasa la imagen H.265 del iPhone al auto sin cambios cuando su formato y tamaño encajan, sin transcodificar en el teléfono; si el iPhone envía H.264 en su lugar (por ejemplo, con *Force H.264*), el retransmisor la convierte a H.265.

        La sesión usa H.264 solo con *Carlink H.265* en *Off*. Entonces el iPhone envía H.264 High, que la app Carlink del auto no puede mostrar, así que el retransmisor la convierte a H.264 Constrained Baseline 3.1, escalada en la forma de la ventana de Carlink para que quepa en ese nivel; el retransmisor Android lo hace con su codificador por hardware.
  connection:
    wifi:
      en: The car creates its own 5 GHz Wi-Fi network for Carlink and the relay joins it, so the relay needs 5 GHz Wi-Fi, switched on. With wireless CarPlay on *This phone’s hotspot*, the Android relay ran a 5 GHz hotspot and joined the car over Wi-Fi at the same time, steadily for about an hour in testing.
      zh: 车机为 Carlink 建立自己的 5 GHz Wi-Fi，中继加入这个网络，因此中继需要支持 5 GHz Wi-Fi，并且 Wi-Fi 要保持打开。无线 CarPlay 使用“此手机的热点”时，安卓中继同时开 5 GHz 热点并用 Wi-Fi 连接车机，实测连续约一小时稳定。
      ru: Автомобиль создаёт для Carlink собственную сеть Wi-Fi 5 ГГц, и ретранслятор подключается к ней, поэтому ретранслятору нужен включённый Wi-Fi 5 ГГц. С беспроводным CarPlay через *This phone’s hotspot* ретранслятор на Android одновременно держал точку доступа 5 ГГц и подключение к автомобилю по Wi-Fi; в испытаниях это стабильно работало около часа.
      es: El auto crea su propia red Wi-Fi de 5 GHz para Carlink y el retransmisor se conecta a ella, así que el retransmisor necesita Wi-Fi de 5 GHz encendido. Con CarPlay inalámbrico en *This phone’s hotspot*, el retransmisor Android mantuvo un punto de acceso de 5 GHz y se conectó al auto por Wi-Fi al mismo tiempo, de forma estable durante aproximadamente una hora en las pruebas.
    pairing:
      en: On the first connection, enter the pairing code shown on the car’s screen into the relay. The relay remembers the pairing, so the code normally isn’t needed again; connecting by itself after the car starts may need the car’s Carlink pairing-code page open.
      zh: 第一次连接时，在中继中输入车机屏幕上显示的配对码。中继会记住配对，之后通常不用再输入；车机开机后自动连接时，可能需要先打开车机 Carlink 应用的配对码页面。
      ru: При первом подключении введите в ретрансляторе код сопряжения, показанный на экране автомобиля. Ретранслятор запоминает сопряжение, поэтому обычно код больше не нужен; для автоматического подключения после запуска автомобиля может потребоваться открыть на нём страницу с кодом сопряжения Carlink.
      es: En la primera conexión, ingresa en el retransmisor el código de enlace que aparece en la pantalla del auto. El retransmisor recuerda el enlace, así que normalmente el código no se necesita de nuevo; para conectarse solo después de que el auto arranca, puede ser necesario tener abierta la página del código de enlace de Carlink en el auto.
    vehicle-info:
      en: 'Tested with this Carlink version (2026-10-20): the car accepted the vehicle information connection, but sent no data after changing gear, switching the lights and changing the day/night theme.'
      zh: 已在这个 Carlink 版本上测试（2026-10-20）：车机接受了车辆信息连接，但换挡、开关车灯和切换日夜主题后都没有发来数据。
      ru: 'Испытано с этой версией Carlink (2026-10-20): автомобиль принял подключение для сведений об автомобиле, но не передал данных после переключения передачи, включения и выключения фар и смены дневной и ночной темы.'
      es: 'Probado con esta versión de Carlink (2026-10-20): el auto aceptó la conexión de información del vehículo, pero no envió datos después de cambiar de marcha, encender y apagar las luces y cambiar el tema de día/noche.'
