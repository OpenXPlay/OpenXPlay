    variant: {en: '2023', zh: 2023 款}
    software: Chromium 120.0.6099.144
    route: browser
    relay:
      en: UFI003, Linux relay development build; Android phone, 0.1.3 development build
      zh: UFI003，Linux 中继开发版；安卓手机，0.1.3 开发版
    date: 2026-10-15..2026-10-18
    result:
      en: Picture shown; with the Android relay, it fits full screen and windows
      zh: 有画面；使用安卓中继时，画面贴合全屏和窗口
  - year: g6-2023
    variant: {en: '2023', zh: 2023 款}
    software: Carlink v2.0.4-202512161819-c0d784a
    route: carlink
    relay:
      en: Android phone, 0.1.4-rc.1 test builds and later development builds
      zh: 安卓手机，0.1.4-rc.1 测试版和之后的开发版
    date: 2026-10-20..2026-10-22
    result:
      en: Picture shown in H.264 and H.265
      zh: H.264 和 H.265 都有画面

