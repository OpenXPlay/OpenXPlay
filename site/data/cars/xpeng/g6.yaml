    carlink:
      status: pass
      text: {en: H.264 and H.265 (10-20—22), zh: H.264 和 H.265（10-20—22）, ru: H.264 и H.265 (10-20—22), es: H.264 y H.265 (10-20—22)}
  - item: touch
