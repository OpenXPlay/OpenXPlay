        zh: 浏览器退出全屏，网页不能自动恢复（10-18）
    carlink:
      status: fixed
      text:
        en: the H.265 picture stayed black (10-20); fixed in Android app 0.1.5
        zh: H.265 画面曾黑屏（10-20），安卓应用 0.1.5 修复
  - item: fullscreen
    browser:
      status: pass
      text:
        en: with the Android relay, the picture fits full screen and windows and switches without reconnecting (10-18)
        zh: 使用安卓中继时画面贴合全屏和窗口，切换不重连（10-18）
