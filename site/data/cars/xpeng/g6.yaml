      status: pass
      text:
        en: with the Android relay, the picture fits full screen and windows and switches without reconnecting (10-18)
        zh: 使用安卓中继时画面贴合全屏和窗口，切换不重连（10-18）
        ru: с ретранслятором на Android изображение подстраивается под полноэкранный режим и окна и переключается без повторного подключения (10-18)
