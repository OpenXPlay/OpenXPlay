# The groups on the Join a group pages (/zh/join, /en/join); read by .vitepress/groups.ts.
#
# fallback  the community group, shown when no brand is chosen and for a brand without a group.
# brands    one entry per car brand, in the order the page lists them:
#   id       the brand's link, lowercase letters, digits and hyphens: openxplay.org/zh/join#<id>
#   name     a plain string for both languages, or {zh: …, en: …}
#   qr       the group's QR image, a path under the repository's Group/; leave it out while the
#            brand has no group, and the page shows the fallback group for that brand
#   updated  optional, the day the QR image was last replaced (2026-11-13)
#
# Example:
#   - id: byd
#     name: {zh: 比亚迪, en: BYD}
#     qr: brands/byd.webp
#     updated: 2026-11-13

fallback:
  qr: Wechat_Group.webp
  updated: 2026-11-13

