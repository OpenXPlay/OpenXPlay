# Every OpenXPlay repository runs this check against one signature list (OpenXPlay/cla-signatures),
# so a contributor accepts the CLA once, by replying on any pull request, for all of them.

name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check CLA acceptance
        if: >-
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Organization secret: a fine-grained token with Contents read/write on cla-signatures only.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-document: https://github.com/OpenXPlay/OpenXPlay/blob/main/CLA.md
          remote-organization-name: OpenXPlay
          remote-repository-name: cla-signatures
          path-to-signatures: signatures/cla.json
          branch: main
          allowlist: riko2chen,dependabot[bot]
