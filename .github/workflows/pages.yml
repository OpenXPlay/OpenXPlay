#
# Builds the website in site/ and deploys it to GitHub Pages. In the repository settings, set
# Pages → Source to "GitHub Actions". SITE_URL and BASE can be set as repository variables.
# Pull requests only build: main requires the build check, so it runs on every pull request.

name: Pages

on:
  push:
    branches: [main]
    # The site plus the diagrams and QR codes its pages show, and the agent skills it mirrors.
    paths:
      - site/**
      - skills/**
      - assets/**
      - Group/**
      - .github/workflows/pages.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://openxplay.org' }}
      BASE: ${{ vars.BASE || '/' }}
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so each page gets its last-updated date from git.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
